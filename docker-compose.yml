services:
  postgres:
    image: postgres:17-alpine
    container_name: vocab-local-db
    command: postgres -c max_connections=500
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: vocab
      POSTGRES_DB: vocab
    ports:
      - "5432:5432"
    volumes:
      - vocab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab -d vocab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vocab-postgres-data:
